  <text x="970" y="935" text-anchor="middle" class="tiny">5V 레일</text><text x="970" y="996" text-anchor="middle" class="tiny">GND 레일</text>
  <rect x="1145" y="928" width="58" height="56" rx="8" fill="#111827"/><text x="1174" y="961" text-anchor="middle" fill="#fff" font-family="Arial" font-size="12">5V</text>

