  <rect x="70" y="260" width="350" height="96" rx="14" class="left"/>
  <rect x="95" y="284" width="62" height="48" rx="8" fill="#111827"/><circle cx="126" cy="308" r="16" fill="#fff" stroke="#94a3b8" stroke-width="4"/><circle cx="126" cy="308" r="8" fill="#f472b6"/>
  <text x="180" y="293" class="label">감정 기반 무드등</text><text x="180" y="318" class="small">R:D3 / G:D5 / B:D6</text><text x="180" y="340" class="small">GND 공통</text>

  <rect x="70" y="380" width="350" height="82" rx="14" class="left"/>
  <rect x="95" y="400" width="62" height="44" rx="8" fill="#0f766e"/><circle cx="126" cy="422" r="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="4"/>
  <text x="180" y="414" class="label">가습기 ON/OFF</text><text x="180" y="438" class="small">DIN:D4 / 외부 5V / GND</text>

  <rect x="70" y="490" width="350" height="70" rx="14" class="left"/>
  <circle cx="126" cy="525" r="14" fill="#ef4444" stroke="#991b1b" stroke-width="3"/>
