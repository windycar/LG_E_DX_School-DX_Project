<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100">
  <defs>
    <style>
      .bg{fill:#fbfafc}
      .title{font-family:Arial,'Malgun Gothic',sans-serif;font-size:42px;font-weight:900;fill:#111827}
      .accent{fill:#e83e72}
      .label{font-family:Arial,'Malgun Gothic',sans-serif;font-size:18px;font-weight:900;fill:#111827}
      .small{font-family:Arial,'Malgun Gothic',sans-serif;font-size:14px;fill:#374151}
      .tiny{font-family:Arial,'Malgun Gothic',sans-serif;font-size:12px;font-weight:800;fill:#111827}
      .pin{font-family:Consolas,monospace;font-size:13px;font-weight:900;fill:#fff}
      .board{fill:#0f8fbd;stroke:#075985;stroke-width:4}
      .chip{fill:#1f2937;stroke:#111827;stroke-width:2}
      .socket{fill:#111827}
      .hole{fill:#f8fafc;stroke:#111827;stroke-width:1.4}
      .tag{fill:#111827;stroke:#fff;stroke-width:1}
      .box{fill:#fff;stroke:#d1d5db;stroke-width:2}
      .left{fill:#fff7fb;stroke:#f3a6bf;stroke-width:2}
      .right{fill:#f8fff9;stroke:#86d69b;stroke-width:2}
      .power{fill:#fff8e6;stroke:#f59e0b;stroke-width:2}
      .note{fill:#fff7ed;stroke:#f97316;stroke-width:2}
      .wBtn{stroke:#6b7280;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .wR{stroke:#ef4444;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .wG{stroke:#22c55e;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .wB{stroke:#2563eb;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .wHum{stroke:#f59e0b;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .wLedR{stroke:#e11d48;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .wLedG{stroke:#16a34a;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .wConn{stroke:#0ea5e9;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .wAir{stroke:#7c3aed;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .wPur{stroke:#2563eb;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .wSda{stroke:#059669;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .wScl{stroke:#0891b2;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .w5{stroke:#dc2626;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .w0{stroke:#111827;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .wUsb{stroke:#0284c7;stroke-width:8;fill:none;stroke-linecap:round}
      .dot{stroke:#fff;stroke-width:2}
