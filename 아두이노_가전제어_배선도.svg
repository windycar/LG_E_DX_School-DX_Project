  <rect x="70" y="680" width="350" height="70" rx="14" class="left"/>
  <circle cx="126" cy="715" r="14" fill="#2563eb" stroke="#1e3a8a" stroke-width="3"/>
  <text x="180" y="707" class="label">서버 연결 상태 표시</text><text x="180" y="731" class="small">파란 LED: D13 / GND</text>

  <!-- Right components -->
  <rect x="1390" y="165" width="340" height="130" rx="16" class="right"/>
  <rect x="1418" y="205" width="80" height="58" rx="8" fill="#15803d" stroke="#166534" stroke-width="3"/><text x="1458" y="238" text-anchor="middle" fill="#fff" font-family="Consolas" font-size="13">ULN2003</text>
  <circle cx="1600" cy="232" r="40" fill="#e5e7eb" stroke="#64748b" stroke-width="4"/><circle cx="1600" cy="232" r="12" fill="#94a3b8"/>
