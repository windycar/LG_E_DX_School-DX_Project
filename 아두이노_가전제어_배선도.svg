  <rect x="1390" y="345" width="340" height="130" rx="16" class="right"/>
  <rect x="1418" y="385" width="80" height="58" rx="8" fill="#15803d" stroke="#166534" stroke-width="3"/><text x="1458" y="418" text-anchor="middle" fill="#fff" font-family="Consolas" font-size="13">ULN2003</text>
  <circle cx="1600" cy="412" r="40" fill="#e5e7eb" stroke="#64748b" stroke-width="4"/><circle cx="1600" cy="412" r="12" fill="#94a3b8"/>
  <text x="1515" y="375" class="label">공기청정기 팬 동작 표현</text><text x="1515" y="401" class="small">A0~A3 → IN1~IN4</text><text x="1515" y="427" class="small">외부 5V / 공통 GND</text>

  <rect x="1390" y="525" width="340" height="122" rx="16" class="right"/>
  <rect x="1420" y="560" width="165" height="56" rx="7" fill="#166534" stroke="#14532d" stroke-width="3"/><rect x="1440" y="574" width="125" height="28" fill="#1e3a8a"/>
  <text x="1502" y="593" text-anchor="middle" fill="#fff" font-family="Arial,'Malgun Gothic'" font-size="13">현재 상태 표시</text>
  <text x="1608" y="558" class="label">I2C 1602 LCD</text><text x="1608" y="584" class="small">A4 SDA / A5 SCL</text><text x="1608" y="608" class="small">5V / GND</text>

