  </defs>

  <rect width="1800" height="1100" class="bg"/>
  <text x="900" y="62" text-anchor="middle" class="title"><tspan class="accent">MOMent</tspan> 아두이노 가전제어 시연 배선도</text>
  <text x="900" y="92" text-anchor="middle" class="small">선은 기판 외곽으로 정리하고, 실제 UNO R3 핀 위치에 꽂히는 지점을 크게 표시했습니다.</text>

  <!-- Main Arduino board -->
  <g id="uno">
    <rect x="540" y="260" width="720" height="420" rx="28" class="board"/>
    <text x="900" y="340" text-anchor="middle" fill="#fff" font-family="Arial,'Malgun Gothic'" font-size="42" font-weight="900">Arduino UNO R3</text>
    <text x="900" y="370" text-anchor="middle" fill="#e0f2fe" font-family="Arial,'Malgun Gothic'" font-size="18">USB Serial 통신</text>
    <rect x="650" y="470" width="150" height="78" rx="8" class="chip"/>
    <text x="725" y="515" text-anchor="middle" fill="#e5e7eb" font-family="Consolas" font-size="14">ATmega</text>
    <rect x="870" y="470" width="220" height="64" rx="8" class="chip"/>
    <text x="980" y="508" text-anchor="middle" fill="#e5e7eb" font-family="Consolas" font-size="14">Controller</text>
    <rect x="498" y="380" width="62" height="88" rx="10" fill="#cbd5e1" stroke="#64748b" stroke-width="3"/>
    <text x="529" y="430" text-anchor="middle" font-family="Arial" font-size="13" font-weight="900" fill="#334155">USB</text>
    <rect x="506" y="560" width="60" height="58" rx="15" fill="#111827"/>
    <text x="536" y="594" text-anchor="middle" fill="#fff" font-family="Arial" font-size="12">DC</text>

    <!-- Digital header -->
    <rect x="610" y="218" width="580" height="38" rx="7" class="socket"/>
    <text x="900" y="207" text-anchor="middle" class="small">DIGITAL PWM</text>
    <circle id="d13" cx="635" cy="237" r="7" class="hole"/><rect x="619" y="262" width="32" height="21" rx="5" class="tag"/><text x="635" y="277" text-anchor="middle" class="pin">D13</text>
    <circle id="d12" cx="675" cy="237" r="7" class="hole"/><rect x="659" y="262" width="32" height="21" rx="5" class="tag"/><text x="675" y="277" text-anchor="middle" class="pin">D12</text>
    <circle id="d11" cx="715" cy="237" r="7" class="hole"/><rect x="699" y="262" width="32" height="21" rx="5" class="tag"/><text x="715" y="277" text-anchor="middle" class="pin">D11</text>
    <circle id="d10" cx="755" cy="237" r="7" class="hole"/><rect x="739" y="262" width="32" height="21" rx="5" class="tag"/><text x="755" y="277" text-anchor="middle" class="pin">D10</text>
    <circle id="d9" cx="795" cy="237" r="7" class="hole"/><rect x="782" y="262" width="26" height="21" rx="5" class="tag"/><text x="795" y="277" text-anchor="middle" class="pin">D9</text>
    <circle id="d8" cx="835" cy="237" r="7" class="hole"/><rect x="822" y="262" width="26" height="21" rx="5" class="tag"/><text x="835" y="277" text-anchor="middle" class="pin">D8</text>
    <circle cx="900" cy="237" r="7" class="hole"/><rect x="881" y="262" width="38" height="21" rx="5" class="tag"/><text x="900" y="277" text-anchor="middle" class="pin">GND</text>
    <circle cx="950" cy="237" r="7" class="hole"/><rect x="930" y="262" width="40" height="21" rx="5" class="tag"/><text x="950" y="277" text-anchor="middle" class="pin">AREF</text>
    <circle id="d7" cx="1005" cy="237" r="7" class="hole"/><rect x="992" y="262" width="26" height="21" rx="5" class="tag"/><text x="1005" y="277" text-anchor="middle" class="pin">D7</text>
    <circle id="d6" cx="1045" cy="237" r="7" class="hole"/><rect x="1032" y="262" width="26" height="21" rx="5" class="tag"/><text x="1045" y="277" text-anchor="middle" class="pin">D6</text>
    <circle id="d5" cx="1085" cy="237" r="7" class="hole"/><rect x="1072" y="262" width="26" height="21" rx="5" class="tag"/><text x="1085" y="277" text-anchor="middle" class="pin">D5</text>
    <circle id="d4" cx="1125" cy="237" r="7" class="hole"/><rect x="1112" y="262" width="26" height="21" rx="5" class="tag"/><text x="1125" y="277" text-anchor="middle" class="pin">D4</text>
    <circle id="d3" cx="1165" cy="237" r="7" class="hole"/><rect x="1152" y="262" width="26" height="21" rx="5" class="tag"/><text x="1165" y="277" text-anchor="middle" class="pin">D3</text>
    <circle id="d2" cx="1205" cy="237" r="7" class="hole"/><rect x="1192" y="262" width="26" height="21" rx="5" class="tag"/><text x="1205" y="277" text-anchor="middle" class="pin">D2</text>

    <!-- Power header -->
    <rect x="650" y="680" width="265" height="38" rx="7" class="socket"/>
    <text x="782" y="748" text-anchor="middle" class="small">POWER</text>
    <circle cx="690" cy="699" r="7" class="hole"/><rect x="670" y="642" width="40" height="22" rx="5" class="tag"/><text x="690" y="658" text-anchor="middle" class="pin">3.3V</text>
    <circle id="p5v" cx="740" cy="699" r="7" class="hole"/><rect x="725" y="642" width="30" height="22" rx="5" class="tag"/><text x="740" y="658" text-anchor="middle" class="pin">5V</text>
    <circle id="pgnd1" cx="790" cy="699" r="7" class="hole"/><rect x="772" y="642" width="36" height="22" rx="5" class="tag"/><text x="790" y="658" text-anchor="middle" class="pin">GND</text>
    <circle id="pgnd2" cx="840" cy="699" r="7" class="hole"/><rect x="822" y="642" width="36" height="22" rx="5" class="tag"/><text x="840" y="658" text-anchor="middle" class="pin">GND</text>
    <circle cx="890" cy="699" r="7" class="hole"/><rect x="874" y="642" width="32" height="22" rx="5" class="tag"/><text x="890" y="658" text-anchor="middle" class="pin">VIN</text>

