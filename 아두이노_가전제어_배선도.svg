    <rect x="950" y="680" width="285" height="38" rx="7" class="socket"/>
    <text x="1092" y="748" text-anchor="middle" class="small">ANALOG IN</text>
    <circle id="a0" cx="990" cy="699" r="7" class="hole"/><rect x="976" y="642" width="28" height="22" rx="5" class="tag"/><text x="990" y="658" text-anchor="middle" class="pin">A0</text>
    <circle id="a1" cx="1035" cy="699" r="7" class="hole"/><rect x="1021" y="642" width="28" height="22" rx="5" class="tag"/><text x="1035" y="658" text-anchor="middle" class="pin">A1</text>
    <circle id="a2" cx="1080" cy="699" r="7" class="hole"/><rect x="1066" y="642" width="28" height="22" rx="5" class="tag"/><text x="1080" y="658" text-anchor="middle" class="pin">A2</text>
    <circle id="a3" cx="1125" cy="699" r="7" class="hole"/><rect x="1111" y="642" width="28" height="22" rx="5" class="tag"/><text x="1125" y="658" text-anchor="middle" class="pin">A3</text>
    <circle id="a4" cx="1170" cy="699" r="7" class="hole"/><rect x="1156" y="642" width="28" height="22" rx="5" class="tag"/><text x="1170" y="658" text-anchor="middle" class="pin">A4</text>
    <circle id="a5" cx="1215" cy="699" r="7" class="hole"/><rect x="1201" y="642" width="28" height="22" rx="5" class="tag"/><text x="1215" y="658" text-anchor="middle" class="pin">A5</text>
  </g>

